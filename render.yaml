services:
  - type: web
    name: reit-valuation-engine
    runtime: python
    plan: free
    region: singapore
    branch: main
    # Free tier has limited build minutes/RAM/CPU, so this installs deps and
    # serves the model/data artifacts already committed to the repo rather
    # than retraining on every deploy. To retrain, run `make pipeline`
    # locally and commit the refreshed files in data/processed/ and models/.
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: >-
      streamlit run app/app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
    autoDeploy: true
    healthCheckPath: /_stcore/health
